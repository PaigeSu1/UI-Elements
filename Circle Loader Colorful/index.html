<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rainbow Spinner</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #0a0a0a;
    }

    #loader {
      position: relative;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 4px solid #240229;
      overflow: hidden;
      box-shadow:
        -5px -5px 5px rgba(255, 255, 255, 0.1),
        10px 10px 10px rgba(0, 0, 0, 0.4),
        inset -5px -5px 5px rgba(255, 255, 255, 0.2),
        inset 10px 10px 10px rgba(0, 0, 0, 0.4);
    }

    /* Inner circle */
    #loader::before {
      content: "";
      position: absolute;
      top: 25px;
      left: 25px;
      right: 25px;
      bottom: 25px;
      z-index: 2;
      background: #0a0a0a;
      border-radius: 50%;
      border: 2px solid #240229;
      box-shadow:
        inset -2px -2px 5px rgba(255, 255, 255, 0.2),
        inset 3px 3px 5px rgba(0, 0, 0, 0.5);
    }

    /* Spinning rainbow */
    #loader span {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      z-index: 1;
      background: conic-gradient(
        #14ffe9,
        #ffeb3b,
        #ff00e0,
        #14ffe9
      );
      filter: blur(20px);
      animation: spin 1s linear infinite;
    }

    /* Second layer for smoother glow */
    #loader span:nth-child(2) {
      animation-delay: -0.5s;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

  </style>
</head>

<body>
  <div id="loader">
    <span></span>
    <span></span>
  </div>
</body>
</html>
